
name: Build AFRINODE AI LIVE BAND

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter application
        run: |
          flutter create --org com.afrinode --project-name afrinode_live_band afrinode_live_band
          cd afrinode_live_band

      - name: Generate application dependencies
        working-directory: afrinode_live_band
        run: |
          cat > pubspec.yaml <<'EOF'
          name: afrinode_live_band
          description: AFRINODE AI Live Band Android client
          publish_to: none
          version: 1.0.0+1

          environment:
            sdk: ">=3.4.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            flutter_midi_pro: ^4.0.4
            record: ^6.1.2
            web_socket_channel: ^3.0.3
            file_picker: ^10.3.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
          EOF

          flutter pub get

      - name: Generate AFRINODE Android application
        working-directory: afrinode_live_band
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:typed_data';

          import 'package:file_picker/file_picker.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_midi_pro/flutter_midi_pro.dart';
          import 'package:record/record.dart';
          import 'package:web_socket_channel/web_socket_channel.dart';

          const serverUrl = String.fromEnvironment(
            'SERVER_URL',
            defaultValue: 'ws://13.140.90.83:8765',
          );

          const serverToken = String.fromEnvironment(
            'SERVER_TOKEN',
            defaultValue: '',
          );

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const AfriNodeApp());
          }

          class AfriNodeApp extends StatelessWidget {
            const AfriNodeApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'AFRINODE AI LIVE BAND',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  colorSchemeSeed: const Color(0xFFD4AF37),
                  useMaterial3: true,
                ),
                home: const LiveBandScreen(),
              );
            }
          }

          class LiveBandScreen extends StatefulWidget {
            const LiveBandScreen({super.key});

            @override
            State<LiveBandScreen> createState() => _LiveBandScreenState();
          }

          class _LiveBandScreenState extends State<LiveBandScreen> {
            final MidiPro midi = MidiPro();
            final AudioRecorder recorder = AudioRecorder();

            WebSocketChannel? socket;
            StreamSubscription? socketSubscription;
            StreamSubscription<Uint8List>? microphoneSubscription;

            int? soundfontId;
            bool synthReady = false;
            bool connected = false;
            bool microphoneRunning = false;
            bool busy = false;

            String status = 'Load a SoundFont to begin';
            String soundfontName = 'No SoundFont selected';

            @override
            void dispose() {
              microphoneSubscription?.cancel();
              socketSubscription?.cancel();
              socket?.sink.close();
              recorder.dispose();
              if (midi.isInitialized) {
                midi.dispose();
              }
              super.dispose();
            }

            Future<void> loadSoundFont() async {
              setState(() => busy = true);

              try {
                if (!midi.isInitialized) {
                  await midi.init(
                    sampleRate: 44100,
                    bufferSize: 128,
                    polyphony: 128,
                  );
                }

                final result = await FilePicker.platform.pickFiles(
                  type: FileType.custom,
                  allowedExtensions: ['sf2'],
                  withData: false,
                );

                if (result == null || result.files.single.path == null) {
                  setState(() => busy = false);
                  return;
                }

                final file = result.files.single;

                soundfontId = await midi.loadSoundfontFile(
                  path: file.path!,
                  bank: 0,
                  program: 0,
                );

                setState(() {
                  synthReady = true;
                  soundfontName = file.name;
                  status = 'SoundFont loaded';
                  busy = false;
                });
              } catch (e) {
                setState(() {
                  status = 'SoundFont error: $e';
                  busy = false;
                });
              }
            }

            Future<void> connectServer() async {
              if (serverToken.isEmpty) {
                setState(() => status = 'Missing server token in APK build');
                return;
              }

              try {
                final newSocket = WebSocketChannel.connect(
                  Uri.parse(serverUrl),
                );

                await newSocket.ready;

                socket = newSocket;

                socket!.sink.add(jsonEncode({
                  'type': 'auth',
                  'token': serverToken,
                  'client': 'AFRINODE_ANDROID',
                  'protocol': 1,
                }));

                socketSubscription = socket!.stream.listen(
                  handleServerMessage,
                  onError: (error) {
                    setState(() {
                      connected = false;
                      status = 'Connection error: $error';
                    });
                  },
                  onDone: () {
                    setState(() {
                      connected = false;
                      status = 'Server disconnected';
                    });
                  },
                );

                setState(() {
                  connected = true;
                  status = 'Connected to AFRINODE server';
                });
              } catch (e) {
                setState(() {
                  connected = false;
                  status = 'Could not connect: $e';
                });
              }
            }

            void handleServerMessage(dynamic message) {
              try {
                if (message is! String) return;

                final data = jsonDecode(message);

                if (data['type'] == 'status') {
                  setState(() {
                    status = data['message']?.toString() ?? 'Server status';
                  });
                  return;
                }

                if (!synthReady || soundfontId == null) return;

                final type = data['type']?.toString();
                final channel = (data['channel'] ?? 0) as int;

                if (type == 'note_on') {
                  midi.playNote(
                    sfId: soundfontId!,
                    channel: channel,
                    key: data['note'] as int,
                    velocity: data['velocity'] as int? ?? 90,
                  );
                } else if (type == 'note_off') {
                  midi.stopNote(
                    sfId: soundfontId!,
                    channel: channel,
                    key: data['note'] as int,
                  );
                } else if (type == 'program_change') {
                  midi.selectInstrument(
                    sfId: soundfontId!,
                    channel: channel,
                    bank: data['bank'] as int? ?? 0,
                    program: data['program'] as int,
                  );
                } else if (type == 'panic') {
                  midi.panic();
                }
              } catch (e) {
                setState(() => status = 'MIDI message error: $e');
              }
            }

            Future<void> startMicrophone() async {
              if (!connected || socket == null) {
                setState(() => status = 'Connect to the server first');
                return;
              }

              try {
                final permitted = await recorder.hasPermission();

                if (!permitted) {
                  setState(() => status = 'Microphone permission denied');
                  return;
                }

                final audioStream = await recorder.startStream(
                  const RecordConfig(
                    encoder: AudioEncoder.pcm16bits,
                    sampleRate: 16000,
                    numChannels: 1,
                  ),
                );

                microphoneSubscription = audioStream.listen((audio) {
                  if (connected && socket != null) {
                    socket!.sink.add(audio);
                  }
                });

                setState(() {
                  microphoneRunning = true;
                  status = 'Microphone streaming to server';
                });
              } catch (e) {
                setState(() => status = 'Microphone error: $e');
              }
            }

            Future<void> stopMicrophone() async {
              await microphoneSubscription?.cancel();
              microphoneSubscription = null;
              await recorder.stop();

              setState(() {
                microphoneRunning = false;
                status = 'Microphone stopped';
              });
            }

            Future<void> disconnect() async {
              await stopMicrophoneIfRunning();
              await socketSubscription?.cancel();
              await socket?.sink.close();

              setState(() {
                connected = false;
                status = 'Disconnected';
              });
            }

            Future<void> stopMicrophoneIfRunning() async {
              if (microphoneRunning) {
                await stopMicrophone();
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'AFRINODE AI LIVE BAND',
                    style: TextStyle(fontWeight: FontWeight.bold),
                  ),
                ),
                body: SafeArea(
                  child: ListView(
                    padding: const EdgeInsets.all(20),
                    children: [
                      const Icon(
                        Icons.graphic_eq,
                        size: 76,
                        color: Color(0xFFD4AF37),
                      ),
                      const SizedBox(height: 12),
                      const Center(
                        child: Text(
                          'LIVE BAND CONTROL',
                          style: TextStyle(
                            fontSize: 21,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ),
                      const SizedBox(height: 24),
                      Card(
                        child: ListTile(
                          leading: Icon(
                            synthReady ? Icons.check_circle : Icons.music_note,
                            color: synthReady ? Colors.green : Colors.amber,
                          ),
                          title: const Text('Instrument synthesizer'),
                          subtitle: Text(soundfontName),
                          trailing: const Icon(Icons.library_music),
                        ),
                      ),
                      ElevatedButton.icon(
                        onPressed: busy ? null : loadSoundFont,
                        icon: const Icon(Icons.folder_open),
                        label: const Text('LOAD SOUNDFONT (.SF2)'),
                      ),
                      const SizedBox(height: 16),
                      Card(
                        child: ListTile(
                          leading: Icon(
                            connected ? Icons.cloud_done : Icons.cloud_off,
                            color: connected ? Colors.green : Colors.orange,
                          ),
                          title: const Text('AFRINODE VPS'),
                          subtitle: const Text(serverUrl),
                        ),
                      ),
                      ElevatedButton.icon(
                        onPressed: connected ? disconnect : connectServer,
                        icon: Icon(
                          connected ? Icons.link_off : Icons.link,
                        ),
                        label: Text(
                          connected ? 'DISCONNECT SERVER' : 'CONNECT SERVER',
                        ),
                      ),
                      const SizedBox(height: 12),
                      ElevatedButton.icon(
                        onPressed: connected
                            ? (microphoneRunning
                                ? stopMicrophone
                                : startMicrophone)
                            : null,
                        icon: Icon(
                          microphoneRunning ? Icons.mic_off : Icons.mic,
                        ),
                        label: Text(
                          microphoneRunning
                              ? 'STOP MICROPHONE'
                              : 'START LIVE INPUT',
                        ),
                      ),
                      const SizedBox(height: 24),
                      Card(
                        child: Padding(
                          padding: const EdgeInsets.all(18),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text(
                                'SYSTEM STATUS',
                                style: TextStyle(
                                  color: Color(0xFFD4AF37),
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                              const SizedBox(height: 10),
                              Text(status),
                            ],
                          ),
                        ),
                      ),
                      const SizedBox(height: 12),
                      const Text(
                        'The server sends MIDI instructions. '
                        'The Android synthesizer renders those instructions '
                        'using the selected SoundFont.',
                        textAlign: TextAlign.center,
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Configure Android microphone and network permissions
        working-directory: afrinode_live_band
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = s.replace(
              '<application',
              '<uses-permission android:name="android.permission.INTERNET"/>'
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>'
              '<application android:usesCleartextTraffic="true"',
              1
          )

          p.write_text(s)
          PY

      - name: Build release APK
        working-directory: afrinode_live_band
        env:
          LIVE_BAND_TOKEN: ${{ secrets.LIVE_BAND_TOKEN }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SERVER_URL=ws://13.140.90.83:8765 \
            --dart-define=SERVER_TOKEN="$LIVE_BAND_TOKEN"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AFRINODE-AI-LIVE-BAND-APK
          path: afrinode_live_band/build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare server files
        run: |
          mkdir -p server

          cat > server/server.py <<'PY'
          import asyncio
          import json
          import os
          import websockets

          TOKEN = os.environ["LIVE_BAND_TOKEN"]

          async def send_test_sequence(ws):
              await ws.send(json.dumps({
                  "type": "status",
                  "message": "Authenticated. MIDI connection test running."
              }))

              # This is a connection and soundfont playback test,
              # NOT the finished AI arrangement engine.
              notes = [60, 64, 67, 72]

              while True:
                  for note in notes:
                      await ws.send(json.dumps({
                          "type": "note_on",
                          "channel": 0,
                          "note": note,
                          "velocity": 75
                      }))
                      await asyncio.sleep(0.45)

                      await ws.send(json.dumps({
                          "type": "note_off",
                          "channel": 0,
                          "note": note
                      }))
                      await asyncio.sleep(0.10)

          async def handler(ws):
              try:
                  first = await asyncio.wait_for(ws.recv(), timeout=10)

                  if not isinstance(first, str):
                      await ws.close(code=1008, reason="Authentication required")
                      return

                  auth = json.loads(first)

                  if auth.get("type") != "auth" or auth.get("token") != TOKEN:
                      await ws.close(code=1008, reason="Invalid token")
                      return

                  sender = asyncio.create_task(send_test_sequence(ws))

                  try:
                      async for message in ws:
                          if isinstance(message, bytes):
                              # Incoming 16 kHz mono PCM from the Android app.
                              # The production analysis pipeline will process it.
                              continue

                          try:
                              data = json.loads(message)
                              print("CLIENT:", data, flush=True)
                          except Exception:
                              pass
                  finally:
                      sender.cancel()

              except Exception as exc:
                  print("CONNECTION ERROR:", exc, flush=True)

          async def main():
              print("AFRINODE LIVE BAND SERVER STARTING", flush=True)

              async with websockets.serve(
                  handler,
                  "0.0.0.0",
                  8765,
                  max_size=2**20,
                  ping_interval=20,
                  ping_timeout=20
              ):
                  print("Listening on port 8765", flush=True)
                  await asyncio.Future()

          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Create VPS deployment directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/afrinode-live-band

      - name: Copy server to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "server/server.py"
          target: "/opt/afrinode-live-band"
          strip_components: 1

      - name: Install and start AFRINODE server
        uses: appleboy/ssh-action@v1.2.0
        env:
          LIVE_BAND_TOKEN: ${{ secrets.LIVE_BAND_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: LIVE_BAND_TOKEN
          script: |
            set -e

            cd /opt/afrinode-live-band

            apt-get update
            apt-get install -y python3 python3-venv

            python3 -m venv venv
            venv/bin/pip install --upgrade pip
            venv/bin/pip install "websockets>=14,<16"

            printf 'LIVE_BAND_TOKEN=%s\n' "$LIVE_BAND_TOKEN" > .env
            chmod 600 .env

            cat > /etc/systemd/system/afrinode-live-band.service <<'EOF'
            [Unit]
            Description=AFRINODE AI Live Band Server
            After=network.target

            [Service]
            Type=simple
            WorkingDirectory=/opt/afrinode-live-band
            EnvironmentFile=/opt/afrinode-live-band/.env
            ExecStart=/opt/afrinode-live-band/venv/bin/python /opt/afrinode-live-band/server.py
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable afrinode-live-band
            systemctl restart afrinode-live-band
            systemctl --no-pager --full status afrinode-live-band
