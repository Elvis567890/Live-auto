
name: AFRINODE AI LIVE BAND - Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build AFRINODE Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --org com.afrinode \
            --project-name afrinode_live_band \
            --platforms android \
            afrinode_live_band

      - name: Generate dependencies
        working-directory: afrinode_live_band
        run: |
          cat > pubspec.yaml <<'EOF'
          name: afrinode_live_band
          description: AFRINODE AI LIVE BAND
          publish_to: none
          version: 3.0.0+1

          environment:
            sdk: ">=3.4.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            flutter_midi_pro: 4.0.4
            web_socket_channel: ^3.0.3
            file_picker: ^10.3.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
          EOF

          flutter pub get

      - name: Generate AFRINODE application
        working-directory: afrinode_live_band
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:async';
          import 'dart:convert';

          import 'package:flutter/material.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:flutter_midi_pro/flutter_midi_pro.dart';
          import 'package:web_socket_channel/web_socket_channel.dart';

          const serverUrl = String.fromEnvironment(
            'AFRINODE_SERVER_URL',
            defaultValue: 'ws://13.140.90.83:8000/ws/band',
          );

          const apiToken = String.fromEnvironment(
            'AFRINODE_API_TOKEN',
            defaultValue: '',
          );

          const gmNames = <String>[
            'Acoustic Grand Piano',
            'Bright Acoustic Piano',
            'Electric Grand Piano',
            'Honky-tonk Piano',
            'Electric Piano 1',
            'Electric Piano 2',
            'Harpsichord',
            'Clavinet',
            'Celesta',
            'Glockenspiel',
            'Music Box',
            'Vibraphone',
            'Marimba',
            'Xylophone',
            'Tubular Bells',
            'Dulcimer',
            'Drawbar Organ',
            'Percussive Organ',
            'Rock Organ',
            'Church Organ',
            'Reed Organ',
            'Accordion',
            'Harmonica',
            'Tango Accordion',
            'Acoustic Guitar Nylon',
            'Acoustic Guitar Steel',
            'Electric Guitar Jazz',
            'Electric Guitar Clean',
            'Electric Guitar Muted',
            'Overdriven Guitar',
            'Distortion Guitar',
            'Guitar Harmonics',
            'Acoustic Bass',
            'Electric Bass Finger',
            'Electric Bass Pick',
            'Fretless Bass',
            'Slap Bass 1',
            'Slap Bass 2',
            'Synth Bass 1',
            'Synth Bass 2',
            'Violin',
            'Viola',
            'Cello',
            'Contrabass',
            'Tremolo Strings',
            'Pizzicato Strings',
            'Orchestral Harp',
            'Timpani',
            'String Ensemble 1',
            'String Ensemble 2',
            'SynthStrings 1',
            'SynthStrings 2',
            'Choir Aahs',
            'Voice Oohs',
            'Synth Voice',
            'Orchestra Hit',
            'Trumpet',
            'Trombone',
            'Tuba',
            'Muted Trumpet',
            'French Horn',
            'Brass Section',
            'SynthBrass 1',
            'SynthBrass 2',
            'Soprano Sax',
            'Alto Sax',
            'Tenor Sax',
            'Baritone Sax',
            'Oboe',
            'English Horn',
            'Bassoon',
            'Clarinet',
            'Piccolo',
            'Flute',
            'Recorder',
            'Pan Flute',
            'Blown Bottle',
            'Shakuhachi',
            'Whistle',
            'Ocarina',
            'Lead 1 Square',
            'Lead 2 Sawtooth',
            'Lead 3 Calliope',
            'Lead 4 Chiff',
            'Lead 5 Charang',
            'Lead 6 Voice',
            'Lead 7 Fifths',
            'Lead 8 Bass Lead',
            'Pad 1 New Age',
            'Pad 2 Warm',
            'Pad 3 Polysynth',
            'Pad 4 Choir',
            'Pad 5 Bowed',
            'Pad 6 Metallic',
            'Pad 7 Halo',
            'Pad 8 Sweep',
            'FX 1 Rain',
            'FX 2 Soundtrack',
            'FX 3 Crystal',
            'FX 4 Atmosphere',
            'FX 5 Brightness',
            'FX 6 Goblins',
            'FX 7 Echoes',
            'FX 8 Sci-fi',
            'Sitar',
            'Banjo',
            'Shamisen',
            'Koto',
            'Kalimba',
            'Bag Pipe',
            'Fiddle',
            'Shanai',
            'Tinkle Bell',
            'Agogo',
            'Steel Drums',
            'Woodblock',
            'Taiko Drum',
            'Melodic Tom',
            'Synth Drum',
            'Reverse Cymbal',
            'Guitar Fret Noise',
            'Breath Noise',
            'Seashore',
            'Bird Tweet',
            'Telephone Ring',
            'Helicopter',
            'Applause',
            'Gunshot',
          ];

          const styles = [
            'worship',
            'contemporary_worship',
            'gospel',
            'african_gospel',
            'afrobeat',
            'jazz',
            'rock',
            'pop',
          ];

          const sections = [
            'UNKNOWN',
            'INTRO',
            'VERSE',
            'BUILD',
            'CHORUS',
            'BREAKDOWN',
            'INTERLUDE',
            'BRIDGE',
            'OUTRO',
          ];

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const AfriNodeApp());
          }

          class AfriNodeApp extends StatelessWidget {
            const AfriNodeApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'AFRINODE AI LIVE BAND',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  colorSchemeSeed: const Color(0xFFD4AF37),
                  useMaterial3: true,
                ),
                home: const BandScreen(),
              );
            }
          }

          class BandScreen extends StatefulWidget {
            const BandScreen({super.key});

            @override
            State<BandScreen> createState() => _BandScreenState();
          }

          class _BandScreenState extends State<BandScreen> {
            final MidiPro midi = MidiPro();

            final bpmController = TextEditingController(text: '100');
            final keyController = TextEditingController(text: 'C');
            final chordController = TextEditingController(text: 'C');

            WebSocketChannel? socket;
            StreamSubscription? subscription;

            int? soundfontId;
            int selectedProgram = 0;

            bool synthReady = false;
            bool connected = false;
            bool busy = false;

            String style = 'worship';
            String section = 'UNKNOWN';
            String status = 'Initialize the MIDI synthesizer';
            String soundfontName = 'No SoundFont loaded';

            double energy = 0.5;
            double confidence = 0.8;
            bool singerActive = true;

            Map<String, dynamic> arrangement = {};
            Map<String, dynamic> serverInstruments = {};

            @override
            void initState() {
              super.initState();
              initializeSynth();
            }

            Future<void> initializeSynth() async {
              try {
                await midi.init(
                  sampleRate: 44100,
                  bufferSize: 64,
                  polyphony: 128,
                );

                await midi.setMasterGain(1.0);

                await midi.setReverb(
                  enabled: true,
                  roomSize: 0.6,
                  level: 0.8,
                );

                await midi.setChorus(enabled: true);

                setState(() {
                  synthReady = true;
                  status = 'MIDI engine ready. Load your SoundFont.';
                });
              } catch (e) {
                setState(() => status = 'Synthesizer error: $e');
              }
            }

            Future<void> loadSoundfont() async {
              if (!synthReady || busy) return;

              setState(() => busy = true);

              try {
                final result = await FilePicker.platform.pickFiles(
                  type: FileType.custom,
                  allowedExtensions: ['sf2'],
                );

                if (result == null || result.files.single.path == null) {
                  setState(() => busy = false);
                  return;
                }

                final file = result.files.single;

                soundfontId = await midi.loadSoundfontFile(
                  filePath: file.path!,
                  bank: 0,
                  program: 0,
                );

                setState(() {
                  soundfontName = file.name;
                  status = 'SoundFont loaded successfully';
                  busy = false;
                });

                await midi.selectInstrument(
                  sfId: soundfontId!,
                  channel: 0,
                  bank: 0,
                  program: 0,
                );
              } catch (e) {
                setState(() {
                  busy = false;
                  status = 'SoundFont error: $e';
                });
              }
            }

            Future<void> connectServer() async {
              if (apiToken.isEmpty) {
                setState(() => status = 'API token missing from build');
                return;
              }

              try {
                final channel = WebSocketChannel.connect(
                  Uri.parse(serverUrl),
                  headers: {
                    'Authorization': 'Bearer $apiToken',
                  },
                );

                await channel.ready;

                socket = channel;

                subscription = channel.stream.listen(
                  receiveServerMessage,
                  onError: (error) {
                    setState(() {
                      connected = false;
                      status = 'WebSocket error: $error';
                    });
                  },
                  onDone: () {
                    setState(() {
                      connected = false;
                      status = 'Server connection closed';
                    });
                  },
                );

                setState(() {
                  connected = true;
                  status = 'Connected to AFRINODE server';
                });

                sendMessage({
                  'type': 'get_status',
                });
              } catch (e) {
                setState(() {
                  connected = false;
                  status = 'Connection failed: $e';
                });
              }
            }

            void sendMessage(Map<String, dynamic> message) {
              if (!connected || socket == null) return;

              socket!.sink.add(jsonEncode(message));
            }

            void sendAnalysis() {
              final bpm = double.tryParse(bpmController.text) ?? 100;

              if (bpm < 40 || bpm > 240) {
                setState(() => status = 'BPM must be between 40 and 240');
                return;
              }

              final data = {
                'bpm': bpm,
                'key': keyController.text.trim().isEmpty
                    ? 'C'
                    : keyController.text.trim(),
                'chord': chordController.text.trim().isEmpty
                    ? 'C'
                    : chordController.text.trim(),
                'energy': energy,
                'confidence': confidence,
                'section': section,
                'style': style,
                'singer_active': singerActive,
                'bar_index': 0,
                'beat_position': 0,
                'detected_notes': <String>[],
              };

              sendMessage({
                'type': 'analysis',
                'data': data,
              });

              setState(() => status = 'Analysis sent. Waiting for arrangement.');
            }

            Future<void> receiveServerMessage(dynamic message) async {
              if (message is! String) return;

              try {
                final decoded = jsonDecode(message);

                if (decoded is! Map) return;

                final type = decoded['type']?.toString();

                if (type == 'connected') {
                  setState(() {
                    status = decoded['message']?.toString() ??
                        'Server connected';
                  });
                  return;
                }

                if (type == 'heartbeat_ack') {
                  setState(() => status = 'Server heartbeat received');
                  return;
                }

                if (type == 'status') {
                  setState(() {
                    status = decoded['status']?.toString() ??
                        'Server online';
                  });
                  return;
                }

                if (type == 'error') {
                  setState(() {
                    status = decoded['message']?.toString() ??
                        'Server returned an error';
                  });
                  return;
                }

                if (type == 'arrangement') {
                  final data = decoded['data'];

                  if (data is! Map) {
                    setState(() => status = 'Invalid arrangement response');
                    return;
                  }

                  final instruments = data['instruments'];

                  if (instruments is! Map) {
                    setState(() => status = 'No instruments in arrangement');
                    return;
                  }

                  setState(() {
                    arrangement = Map<String, dynamic>.from(data);
                    serverInstruments =
                        Map<String, dynamic>.from(instruments);
                    status = 'Arrangement received from server';
                  });

                  await applyInstrumentPrograms();
                  return;
                }
              } catch (e) {
                setState(() => status = 'Message processing error: $e');
              }
            }

            Future<void> applyInstrumentPrograms() async {
              if (soundfontId == null) {
                setState(() {
                  status = 'Arrangement received. Load an SF2 to select instruments.';
                });
                return;
              }

              int applied = 0;

              for (final entry in serverInstruments.entries) {
                final value = entry.value;

                if (value is! Map) continue;
                if (value['enabled'] != true) continue;

                final program = value['program'];
                final channel = value['channel'];

                if (program is! num || channel is! num) continue;

                final p = program.toInt().clamp(0, 127);
                final c = channel.toInt().clamp(0, 15);

                await midi.selectInstrument(
                  sfId: soundfontId!,
                  channel: c,
                  bank: 0,
                  program: p,
                );

                applied++;
              }

              setState(() {
                status = '$applied server-selected instrument programs applied';
              });
            }

            Future<void> testSound() async {
              if (soundfontId == null) {
                setState(() => status = 'Load a SoundFont first');
                return;
              }

              await midi.selectInstrument(
                sfId: soundfontId!,
                channel: 0,
                bank: 0,
                program: selectedProgram,
              );

              await midi.playNote(
                sfId: soundfontId!,
                channel: 0,
                key: 60,
                velocity: 110,
              );

              await Future.delayed(const Duration(milliseconds: 700));

              await midi.stopNote(
                sfId: soundfontId!,
                channel: 0,
                key: 60,
              );
            }

            Future<void> disconnect() async {
              await subscription?.cancel();
              subscription = null;

              await socket?.sink.close();
              socket = null;

              if (synthReady) {
                await midi.panic();
              }

              setState(() {
                connected = false;
                status = 'Disconnected from server';
              });
            }

            @override
            void dispose() {
              subscription?.cancel();
              socket?.sink.close();

              bpmController.dispose();
              keyController.dispose();
              chordController.dispose();

              if (midi.isInitialized) {
                midi.dispose();
              }

              super.dispose();
            }

            Widget instrumentList() {
              if (serverInstruments.isEmpty) {
                return const Text('No arrangement received yet.');
              }

              return Column(
                children: serverInstruments.entries.map((entry) {
                  final item = entry.value;

                  if (item is! Map) {
                    return const SizedBox.shrink();
                  }

                  final program = item['program'] is num
                      ? (item['program'] as num).toInt()
                      : 0;

                  final channel = item['channel'] ?? 0;
                  final name = program >= 0 && program < 128
                      ? gmNames[program]
                      : 'Unknown instrument';

                  return ListTile(
                    dense: true,
                    leading: const Icon(Icons.music_note),
                    title: Text(entry.key.replaceAll('_', ' ').toUpperCase()),
                    subtitle: Text(
                      '$name · Program $program · Channel $channel',
                    ),
                    trailing: const Icon(
                      Icons.check_circle,
                      color: Colors.green,
                    ),
                  );
                }).toList(),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'AFRINODE AI LIVE BAND',
                    style: TextStyle(fontWeight: FontWeight.bold),
                  ),
                ),
                body: SafeArea(
                  child: ListView(
                    padding: const EdgeInsets.all(16),
                    children: [
                      const Icon(
                        Icons.graphic_eq,
                        color: Color(0xFFD4AF37),
                        size: 64,
                      ),

                      const Center(
                        child: Text(
                          'SERVER-CONTROLLED MIDI BAND',
                          style: TextStyle(
                            fontWeight: FontWeight.bold,
                            fontSize: 18,
                          ),
                        ),
                      ),

                      const SizedBox(height: 18),

                      Card(
                        child: ListTile(
                          leading: Icon(
                            synthReady ? Icons.check_circle : Icons.error,
                            color: synthReady ? Colors.green : Colors.red,
                          ),
                          title: const Text('MIDI synthesizer'),
                          subtitle: Text(soundfontName),
                        ),
                      ),

                      ElevatedButton.icon(
                        onPressed: busy ? null : loadSoundfont,
                        icon: const Icon(Icons.library_music),
                        label: const Text('LOAD SOUNDFONT (.SF2)'),
                      ),

                      Card(
                        child: Padding(
                          padding: const EdgeInsets.all(14),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text(
                                '128 GENERAL MIDI PROGRAMS',
                                style: TextStyle(fontWeight: FontWeight.bold),
                              ),
                              const SizedBox(height: 12),
                              DropdownButtonFormField<int>(
                                value: selectedProgram,
                                isExpanded: true,
                                decoration: const InputDecoration(
                                  labelText: 'Local sound test instrument',
                                  border: OutlineInputBorder(),
                                ),
                                items: List.generate(
                                  128,
                                  (i) => DropdownMenuItem(
                                    value: i,
                                    child: Text('${i + 1}. ${gmNames[i]}'),
                                  ),
                                ),
                                onChanged: (value) {
                                  if (value != null) {
                                    setState(() => selectedProgram = value);
                                  }
                                },
                              ),
                              const SizedBox(height: 10),
                              OutlinedButton.icon(
                                onPressed: testSound,
                                icon: const Icon(Icons.play_arrow),
                                label: const Text('TEST LOCAL INSTRUMENT'),
                              ),
                            ],
                          ),
                        ),
                      ),

                      Card(
                        child: ListTile(
                          leading: Icon(
                            connected ? Icons.cloud_done : Icons.cloud_off,
                            color: connected ? Colors.green : Colors.orange,
                          ),
                          title: const Text('AFRINODE VPS'),
                          subtitle: Text(serverUrl),
                        ),
                      ),

                      ElevatedButton.icon(
                        onPressed: connected ? disconnect : connectServer,
                        icon: Icon(
                          connected ? Icons.link_off : Icons.link,
                        ),
                        label: Text(
                          connected ? 'DISCONNECT SERVER' : 'CONNECT SERVER',
                        ),
                      ),

                      const SizedBox(height: 18),

                      Card(
                        child: Padding(
                          padding: const EdgeInsets.all(14),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text(
                                'ANALYSIS INPUT',
                                style: TextStyle(
                                  fontWeight: FontWeight.bold,
                                  color: Color(0xFFD4AF37),
                                ),
                              ),

                              const SizedBox(height: 12),

                              TextField(
                                controller: bpmController,
                                keyboardType: TextInputType.number,
                                decoration: const InputDecoration(
                                  labelText: 'Tempo (BPM)',
                                  border: OutlineInputBorder(),
                                ),
                              ),

                              const SizedBox(height: 10),

                              TextField(
                                controller: keyController,
                                decoration: const InputDecoration(
                                  labelText: 'Musical key',
                                  hintText: 'C, D, E, F, G, A, B',
                                  border: OutlineInputBorder(),
                                ),
                              ),

                              const SizedBox(height: 10),

                              TextField(
                                controller: chordController,
                                decoration: const InputDecoration(
                                  labelText: 'Current chord',
                                  hintText: 'C, Am, F, G',
                                  border: OutlineInputBorder(),
                                ),
                              ),

                              const SizedBox(height: 12),

                              DropdownButtonFormField<String>(
                                value: style,
                                decoration: const InputDecoration(
                                  labelText: 'Music style',
                                ),
                                items: styles.map((value) {
                                  return DropdownMenuItem(
                                    value: value,
                                    child: Text(value.replaceAll('_', ' ')),
                                  );
                                }).toList(),
                                onChanged: (value) {
                                  if (value != null) {
                                    setState(() => style = value);
                                  }
                                },
                              ),

                              const SizedBox(height: 12),

                              DropdownButtonFormField<String>(
                                value: section,
                                decoration: const InputDecoration(
                                  labelText: 'Song section',
                                ),
                                items: sections.map((value) {
                                  return DropdownMenuItem(
                                    value: value,
                                    child: Text(value),
                                  );
                                }).toList(),
                                onChanged: (value) {
                                  if (value != null) {
                                    setState(() => section = value);
                                  }
                                },
                              ),

                              const SizedBox(height: 12),

                              Text('Energy: ${energy.toStringAsFixed(2)}'),
                              Slider(
                                value: energy,
                                onChanged: (value) {
                                  setState(() => energy = value);
                                },
                              ),

                              Text(
                                'Analysis confidence: ${confidence.toStringAsFixed(2)}',
                              ),
                              Slider(
                                value: confidence,
                                onChanged: (value) {
                                  setState(() => confidence = value);
                                },
                              ),

                              SwitchListTile(
                                contentPadding: EdgeInsets.zero,
                                title: const Text('Singer active'),
                                value: singerActive,
                                onChanged: (value) {
                                  setState(() => singerActive = value);
                                },
                              ),

                              const SizedBox(height: 10),

                              ElevatedButton.icon(
                                onPressed: connected ? sendAnalysis : null,
                                icon: const Icon(Icons.send),
                                label: const Text('SEND ANALYSIS TO SERVER'),
                              ),
                            ],
                          ),
                        ),
                      ),

                      Card(
                        child: Padding(
                          padding: const EdgeInsets.all(14),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text(
                                'SERVER ARRANGEMENT',
                                style: TextStyle(
                                  color: Color(0xFFD4AF37),
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                              const SizedBox(height: 8),
                              Text('Style: ${arrangement['style'] ?? '-'}'),
                              Text('Section: ${arrangement['section'] ?? '-'}'),
                              Text('Tempo: ${arrangement['bpm'] ?? '-'} BPM'),
                              Text('Key: ${arrangement['key'] ?? '-'}'),
                              Text('Chord: ${arrangement['chord'] ?? '-'}'),
                              Text('Fill: ${arrangement['fill'] ?? '-'}'),
                              const Divider(),
                              const Text(
                                'INSTRUMENTS SELECTED BY SERVER',
                                style: TextStyle(fontWeight: FontWeight.bold),
                              ),
                              instrumentList(),
                            ],
                          ),
                        ),
                      ),

                      Card(
                        child: Padding(
                          padding: const EdgeInsets.all(14),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text(
                                'CONNECTION STATUS',
                                style: TextStyle(
                                  color: Color(0xFFD4AF37),
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                              const SizedBox(height: 8),
                              Text(status),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

      - name: Configure Android permissions
        working-directory: afrinode_live_band
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
          """

          content = content.replace(
              "<application",
              permissions + "\n    <application",
              1
          )

          content = content.replace(
              "<application",
              '<application android:usesCleartextTraffic="true"',
              1
          )

          path.write_text(content)
          PY

      - name: Build release Android APK
        working-directory: afrinode_live_band
        env:
          SERVER_URL: ${{ secrets.AFRINODE_SERVER_URL }}
          API_TOKEN: ${{ secrets.AFRINODE_API_TOKEN }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "Missing AFRINODE_SERVER_URL secret"
            exit 1
          fi

          if [ -z "$API_TOKEN" ]; then
            echo "Missing AFRINODE_API_TOKEN secret"
            exit 1
          fi

          flutter pub get

          flutter build apk --release \
            --dart-define=AFRINODE_SERVER_URL="$SERVER_URL" \
            --dart-define=AFRINODE_API_TOKEN="$API_TOKEN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
