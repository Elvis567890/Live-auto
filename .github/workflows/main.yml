name: Build AI Live Band App

on:
  push:
    branches: [ main, master, first-prototype ]
  pull_request:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # 1. SCAFFOLD — creates every C++ file and Projucer project
  # ─────────────────────────────────────────────
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Download SoundFont and TinySoundFont
        run: |
          # 下载 TinySoundFont 头文件
          wget -q https://raw.githubusercontent.com/schellingb/TinySoundFont/master/tsf.h
          # 使用稳定的 GitHub 链接下载 GeneralUser GS SoundFont
          wget -q https://raw.githubusercontent.com/Abdess/retrobios/main/bios/Other/GeneralUser%20GS/GeneralUser-GS.sf2 -O SoundFont.sf2

      - name: Create project files
        run: |
          mkdir -p Source
          mv tsf.h Source/tsf.h
          mv SoundFont.sf2 Source/SoundFont.sf2

          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(AILiveBand VERSION 0.1.0 LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          include(FetchContent)
          FetchContent_Declare(
            JUCE
            GIT_REPOSITORY https://github.com/juce-framework/JUCE.git
            GIT_TAG 8.0.6
            GIT_SHALLOW TRUE
          )
          FetchContent_MakeAvailable(JUCE)

          juce_add_binary_data(BinaryData SOURCES Source/SoundFont.sf2)

          juce_add_gui_app(AILiveBand
            PRODUCT_NAME "AI Live Band"
            COMPANY_NAME "AILiveBand"
            VERSION "0.1.0"
            MICROPHONE_PERMISSION_ENABLED TRUE
            MICROPHONE_PERMISSION_TEXT "AI Live Band needs microphone access to listen to your singing."
          )

          juce_generate_juce_header(AILiveBand)

          target_sources(AILiveBand PRIVATE
            Source/Main.cpp
            Source/MainComponent.cpp
            Source/PitchDetector.cpp
            Source/ChordInference.cpp
            Source/Arranger.cpp
            Source/SoundFontSynth.cpp
          )

          target_compile_definitions(AILiveBand PRIVATE
            JUCE_WEB_BROWSER=0
            JUCE_USE_CURL=0
            JUCE_DISPLAY_SPLASH_SCREEN=0
            JUCE_APPLICATION_NAME_STRING="AI Live Band"
            JUCE_APPLICATION_VERSION_STRING="0.1.0"
          )

          target_link_libraries(AILiveBand PRIVATE
            BinaryData
            juce::juce_audio_utils
            juce::juce_audio_devices
            juce::juce_dsp
            juce::juce_gui_extra
            PUBLIC
            juce::juce_recommended_config_flags
            juce::juce_recommended_warning_flags
          )
          EOF

          cat > AILiveBand.jucer << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <JUCERPROJECT id="ai-live-band" name="AILiveBand" projectType="guiapp" version="0.1.0" bundleIdentifier="com.ailiveband.app" companyName="AILiveBand" companyWebsite="" companyEmail="" defines="" headerPath="" jucerVersion="8.0.6" cppLanguageStandard="17" useAppConfig="1" displaySplashScreen="0">
            <MAINGROUP id="main-group" name="AILiveBand">
              <GROUP id="source-group" name="Source">
                <FILE id="main-cpp" name="Main.cpp" compile="1" resource="0" file="Source/Main.cpp"/>
                <FILE id="main-component-h" name="MainComponent.h" compile="0" resource="0" file="Source/MainComponent.h"/>
                <FILE id="main-component-cpp" name="MainComponent.cpp" compile="1" resource="0" file="Source/MainComponent.cpp"/>
                <FILE id="pitch-detector-h" name="PitchDetector.h" compile="0" resource="0" file="Source/PitchDetector.h"/>
                <FILE id="pitch-detector-cpp" name="PitchDetector.cpp" compile="1" resource="0" file="Source/PitchDetector.cpp"/>
                <FILE id="chord-inference-h" name="ChordInference.h" compile="0" resource="0" file="Source/ChordInference.h"/>
                <FILE id="chord-inference-cpp" name="ChordInference.cpp" compile="1" resource="0" file="Source/ChordInference.cpp"/>
                <FILE id="arranger-h" name="Arranger.h" compile="0" resource="0" file="Source/Arranger.h"/>
                <FILE id="arranger-cpp" name="Arranger.cpp" compile="1" resource="0" file="Source/Arranger.cpp"/>
                <FILE id="synth-h" name="SoundFontSynth.h" compile="0" resource="0" file="Source/SoundFontSynth.h"/>
                <FILE id="synth-cpp" name="SoundFontSynth.cpp" compile="1" resource="0" file="Source/SoundFontSynth.cpp"/>
                <FILE id="tsf-h" name="tsf.h" compile="0" resource="0" file="Source/tsf.h"/>
                <FILE id="sf2" name="SoundFont.sf2" compile="0" resource="1" file="Source/SoundFont.sf2"/>
              </GROUP>
            </MAINGROUP>
            <MODULES>
              <MODULE id="juce_audio_basics" showAllCode="1" useLocalCopy="0"/>
              <MODULE id="juce_audio_devices" showAllCode="1" useLocalCopy="0"/>
              <MODULE id="juce_audio_formats" showAllCode="1" useLocalCopy="0"/>
              <MODULE id="juce_audio_processors" showAllCode="1" useLocalCopy="0"/>
              <MODULE id="juce_audio_utils" showAllCode="1" useLocalCopy="0"/>
              <MODULE id="juce_core" showAllCode="1" useLocalCopy="0"/>
              <MODULE id="juce_data_structures" showAllCode="1" useLocalCopy="0"/>
              <MODULE id="juce_dsp" showAllCode="1" useLocalCopy="0"/>
              <MODULE id="juce_events" showAllCode="1" useLocalCopy="0"/>
              <MODULE id="juce_graphics" showAllCode="1" useLocalCopy="0"/>
              <MODULE id="juce_gui_basics" showAllCode="1" useLocalCopy="0"/>
              <MODULE id="juce_gui_extra" showAllCode="1" useLocalCopy="0"/>
            </MODULES>
            <EXPORTFORMATS>
              <ANDROIDSTUDIO id="android-exporter" targetFolder="Builds/Android">
                <CONFIGURATIONS>
                  <CONFIGURATION name="Debug" isDebug="1" targetName="AILiveBand"/>
                  <CONFIGURATION name="Release" isDebug="0" targetName="AILiveBand" optimise="1"/>
                </CONFIGURATIONS>
                <MODULEPATHS/>
              </ANDROIDSTUDIO>
            </EXPORTFORMATS>
          </JUCERPROJECT>
          EOF

          cat > Source/PitchDetector.h << 'EOF'
          #pragma once
          #include <JuceHeader.h>
          class PitchDetector {
          public:
              explicit PitchDetector(double sampleRate);
              float detect(const float* samples, int numSamples);
              static juce::String freqToNote(float freq);
              static int freqToMidi(float freq);
          private:
              double sr;
          };
          EOF
          cat > Source/PitchDetector.cpp << 'EOF'
          #include "PitchDetector.h"
          PitchDetector::PitchDetector(double sampleRate) : sr(sampleRate) {}
          float PitchDetector::detect(const float* samples, int numSamples) {
              if (numSamples < 64) return 0.0f;
              float mean = 0.0f;
              for (int i = 0; i < numSamples; ++i) mean += samples[i];
              mean /= (float)numSamples;
              float energy = 0.0f;
              for (int i = 0; i < numSamples; ++i) { float v = samples[i] - mean; energy += v * v; }
              if (energy < 1e-5f) return 0.0f;
              int minLag = (int)(sr / 1000.0); int maxLag = (int)(sr / 60.0);
              if (maxLag >= numSamples) maxLag = numSamples - 1;
              if (minLag < 1) minLag = 1;
              int bestLag = 0; float bestCorr = 0.0f;
              for (int lag = minLag; lag <= maxLag; ++lag) {
                  float corr = 0.0f;
                  for (int i = 0; i < numSamples - lag; ++i) corr += (samples[i] - mean) * (samples[i + lag] - mean);
                  if (corr > bestCorr) { bestCorr = corr; bestLag = lag; }
              }
              if (bestLag == 0 || bestCorr < 0.2f * energy) return 0.0f;
              return (float)(sr / (double)bestLag);
          }
          juce::String PitchDetector::freqToNote(float freq) {
              if (freq <= 0.0f) return "-";
              static const char* names[] = {"C","C#","D","D#","E","F","F#","G","G#","A","A#","B"};
              int midi = freqToMidi(freq); int pc = ((midi % 12) + 12) % 12; int oct = midi / 12 - 1;
              return juce::String(names[pc]) + juce::String(oct);
          }
          int PitchDetector::freqToMidi(float freq) {
              if (freq <= 0.0f) return 0;
              return (int)std::round(69.0 + 12.0 * std::log2(freq / 440.0));
          }
          EOF

          cat > Source/ChordInference.h << 'EOF'
          #pragma once
          #include <JuceHeader.h>
          #include <vector>
          class ChordInference {
          public:
              void addNote(int midi);
              juce::String getChord() const;
              int getRootNote() const;
              std::vector<int> getChordNotes() const;
              void clear();
          private:
              std::vector<int> recent;
              mutable juce::CriticalSection lock;
          };
          EOF
          cat > Source/ChordInference.cpp << 'EOF'
          #include "ChordInference.h"
          namespace {
              const char* ROOTS[] = {"C","C#","D","D#","E","F","F#","G","G#","A","A#","B"};
              struct Template { const char* name; std::vector<int> intervals; };
              const std::vector<Template> TEMPLATES = {
                  {"maj",  {0,4,7}}, {"min",  {0,3,7}}, {"dim",  {0,3,6}}, {"aug",  {0,4,8}}, {"sus4", {0,5,7}}, {"maj7", {0,4,7,11}}, {"min7", {0,3,7,10}},
              };
          }
          void ChordInference::addNote(int midi) {
              if (midi <= 0) return;
              const juce::ScopedLock sl(lock);
              recent.push_back(midi);
              if (recent.size() > 12) recent.erase(recent.begin());
          }
          void ChordInference::clear() { const juce::ScopedLock sl(lock); recent.clear(); }
          juce::String ChordInference::getChord() const {
              const juce::ScopedLock sl(lock);
              if (recent.empty()) return "-";
              int counts[12] = {0};
              for (int n : recent) counts[((n % 12) + 12) % 12]++;
              int bestRoot = -1, bestScore = -1; juce::String bestName;
              for (int root = 0; root < 12; ++root) {
                  for (auto& t : TEMPLATES) {
                      int score = 0, outside = 0; bool inChord[12] = {false};
                      for (int iv : t.intervals) inChord[(root + iv) % 12] = true;
                      for (int pc = 0; pc < 12; ++pc) { if (inChord[pc]) score += counts[pc]; else outside += counts[pc]; }
                      score -= outside / 2;
                      if (score > bestScore) { bestScore = score; bestRoot = root; bestName = juce::String(ROOTS[root]) + t.name; }
                  }
              }
              return bestRoot < 0 ? juce::String("-") : bestName;
          }
          int ChordInference::getRootNote() const {
              juce::String chord = getChord(); if (chord == "-") return 48;
              for (int i = 0; i < 12; ++i) { if (chord.startsWith(ROOTS[i])) return 48 + i; }
              return 48;
          }
          std::vector<int> ChordInference::getChordNotes() const {
              std::vector<int> notes; juce::String chord = getChord(); if (chord == "-") return notes;
              int root = 60; juce::String quality = chord;
              for (int i = 0; i < 12; ++i) {
                  if (chord.startsWith(ROOTS[i])) { root += i; quality = chord.substring(juce::String(ROOTS[i]).length()); break; }
              }
              notes.push_back(root);
              if (quality.contains("maj")) { notes.push_back(root+4); notes.push_back(root+7); if (quality.contains("7")) notes.push_back(root+11); }
              else if (quality.contains("min")) { notes.push_back(root+3); notes.push_back(root+7); if (quality.contains("7")) notes.push_back(root+10); }
              else if (quality.contains("dim")) { notes.push_back(root+3); notes.push_back(root+6); }
              else if (quality.contains("aug")) { notes.push_back(root+4); notes.push_back(root+8); }
              else if (quality.contains("sus4")) { notes.push_back(root+5); notes.push_back(root+7); }
              return notes;
          }
          EOF

          cat > Source/SoundFontSynth.h << 'EOF'
          #pragma once
          #include <JuceHeader.h>
          struct tsf;
          class SoundFontSynth {
          public:
              SoundFontSynth();
              ~SoundFontSynth();
              void initialize(double sampleRate);
              void noteOn(int channel, int midiNote, float velocity);
              void noteOff(int channel, int midiNote);
              void render(float* leftChannel, float* rightChannel, int numSamples);
              void setInstrument(int channel, int programNumber);
          private:
              tsf* synth = nullptr;
          };
          EOF
          cat > Source/SoundFontSynth.cpp << 'EOF'
          #include "SoundFontSynth.h"
          #define TSF_IMPLEMENTATION
          #include "tsf.h"

          SoundFontSynth::SoundFontSynth() {}
          SoundFontSynth::~SoundFontSynth() { if (synth) tsf_close(synth); }

          void SoundFontSynth::initialize(double sampleRate) {
              if (synth) tsf_close(synth);
              if (BinaryData::SoundFont_sf2Size == 0) return; 
              synth = tsf_load_memory(BinaryData::SoundFont_sf2, BinaryData::SoundFont_sf2Size);
              if (synth && sampleRate > 0) {
                  tsf_set_output(synth, TSF_STEREO_INTERLEAVED, (int)sampleRate, 0);
                  tsf_channel_set_presetnumber(synth, 0, 0, 0); 
                  tsf_channel_set_presetnumber(synth, 1, 32, 0); 
                  tsf_channel_set_presetnumber(synth, 9, 0, 1);
              }
          }

          void SoundFontSynth::noteOn(int channel, int midiNote, float velocity) {
              if (synth) tsf_channel_note_on(synth, channel, midiNote, velocity);
          }

          void SoundFontSynth::noteOff(int channel, int midiNote) {
              if (synth) tsf_channel_note_off(synth, channel, midiNote);
          }

          void SoundFontSynth::render(float* leftChannel, float* rightChannel, int numSamples) {
              if (synth) {
                  juce::HeapBlock<float> interleavedBuffer(numSamples * 2);
                  tsf_render_float(synth, interleavedBuffer.getData(), numSamples, 0);
                  for (int i = 0; i < numSamples; ++i) {
                      leftChannel[i] = interleavedBuffer[i * 2];
                      if (rightChannel) rightChannel[i] = interleavedBuffer[i * 2 + 1];
                  }
              } else {
                  juce::FloatVectorOperations::clear(leftChannel, numSamples);
                  if (rightChannel) juce::FloatVectorOperations::clear(rightChannel, numSamples);
              }
          }

          void SoundFontSynth::setInstrument(int channel, int programNumber) {
              if (synth) tsf_channel_set_presetnumber(synth, channel, programNumber, 0);
          }
          EOF

          cat > Source/Arranger.h << 'EOF'
          #pragma once
          #include <JuceHeader.h>
          #include "ChordInference.h"
          #include "SoundFontSynth.h"

          class Arranger : public juce::Timer {
          public:
              Arranger(ChordInference& ci, SoundFontSynth& s);
              void start();
              void stop();
              bool playPiano = true;
              bool playBass = true;
              bool playDrums = true;
          private:
              void timerCallback() override;
              ChordInference& chordEngine;
              SoundFontSynth& synth;
              int beatCounter = 0;
          };
          EOF
          cat > Source/Arranger.cpp << 'EOF'
          #include "Arranger.h"
          Arranger::Arranger(ChordInference& ci, SoundFontSynth& s) : chordEngine(ci), synth(s) {}
          void Arranger::start() { beatCounter = 0; startTimer(500); }
          void Arranger::stop() { stopTimer(); }
          void Arranger::timerCallback() {
              int root = chordEngine.getRootNote();
              auto notes = chordEngine.getChordNotes();
              if (playBass && (beatCounter % 4 == 0 || beatCounter % 4 == 2)) synth.noteOn(1, root, 0.8f);
              if (playPiano && (beatCounter % 4 == 0) && !notes.empty()) {
                  for (int note : notes) synth.noteOn(0, note, 0.6f);
              }
              if (playDrums) {
                  int drumNote = (beatCounter % 4 == 0 || beatCounter % 4 == 2) ? 36 : 38;
                  synth.noteOn(9, drumNote, 1.0f);
              }
              beatCounter++;
              if (beatCounter > 3) beatCounter = 0;
          }
          EOF

          cat > Source/MainComponent.h << 'EOF'
          #pragma once
          #include <JuceHeader.h>
          #include "PitchDetector.h"
          #include "ChordInference.h"
          #include "Arranger.h"
          #include "SoundFontSynth.h"

          class MainComponent : public juce::Component, public juce::AudioIODeviceCallback, private juce::Timer {
          public:
              MainComponent();
              ~MainComponent() override;
              void paint(juce::Graphics&) override;
              void resized() override;
              void audioDeviceIOCallbackWithContext(const float* const* inputChannelData, int numInputChannels, float* const* outputChannelData, int numOutputChannels, int numSamples, const juce::AudioIODeviceCallbackContext& context) override;
              void audioDeviceAboutToStart(juce::AudioIODevice* device) override;
              void audioDeviceStopped() override;
          private:
              void timerCallback() override;
              void startAudio();
              void stopAudio();

              juce::AudioDeviceManager deviceManager;
              std::unique_ptr<PitchDetector> pitchDetector;
              ChordInference chordInference;
              SoundFontSynth synth;
              std::unique_ptr<Arranger> arranger;

              juce::Label noteLabel, chordLabel, statusLabel;
              juce::ComboBox instrumentSelector;
              juce::TextButton startButton { "Start" };

              std::atomic<float> currentFreq { 0.0f };

              JUCE_DECLARE_NON_COPYABLE_WITH_LEAK_DETECTOR(MainComponent)
          };
          EOF
          cat > Source/MainComponent.cpp << 'EOF'
          #include "MainComponent.h"

          MainComponent::MainComponent() {
              addAndMakeVisible(noteLabel); addAndMakeVisible(chordLabel); addAndMakeVisible(statusLabel);
              addAndMakeVisible(startButton); addAndMakeVisible(instrumentSelector);

              noteLabel.setFont(juce::Font(juce::FontOptions(32.0f)));
              chordLabel.setFont(juce::Font(juce::FontOptions(32.0f)));
              statusLabel.setFont(juce::Font(juce::FontOptions(16.0f)));
              
              noteLabel.setJustificationType(juce::Justification::centred);
              chordLabel.setJustificationType(juce::Justification::centred);
              statusLabel.setJustificationType(juce::Justification::centred);
              noteLabel.setColour(juce::Label::textColourId, juce::Colours::white);
              chordLabel.setColour(juce::Label::textColourId, juce::Colours::cyan);
              statusLabel.setColour(juce::Label::textColourId, juce::Colours::grey);

              instrumentSelector.addItem("Acoustic Grand Piano", 1);
              instrumentSelector.addItem("Electric Piano", 2);
              instrumentSelector.addItem("Acoustic Guitar", 3);
              instrumentSelector.addItem("Electric Guitar (Clean)", 4);
              instrumentSelector.addItem("Violin", 5);
              instrumentSelector.addItem("String Ensemble", 6);
              instrumentSelector.addItem("Synth Pad", 7);
              
              instrumentSelector.setSelectedId(1, juce::dontSendNotification);

              instrumentSelector.onChange = [this] {
                  int selection = instrumentSelector.getSelectedId();
                  int programNumber = 0;
                  if (selection == 2) programNumber = 4;
                  else if (selection == 3) programNumber = 24;
                  else if (selection == 4) programNumber = 27;
                  else if (selection == 5) programNumber = 40;
                  else if (selection == 6) programNumber = 48;
                  else if (selection == 7) programNumber = 89;
                  synth.setInstrument(0, programNumber);
              };

              startButton.onClick = [this] {
                  if (deviceManager.getCurrentAudioDevice() == nullptr) {
                      if (!juce::RuntimePermissions::isGranted(juce::RuntimePermissions::recordAudio)) {
                          juce::RuntimePermissions::request(juce::RuntimePermissions::recordAudio, [this](bool granted) { if (granted) startAudio(); });
                      } else { startAudio(); }
                  } else { stopAudio(); }
              };

              setSize(700, 600);
              startTimerHz(20);
          }

          MainComponent::~MainComponent() { stopTimer(); stopAudio(); }

          void MainComponent::startAudio() {
              arranger = std::make_unique<Arranger>(chordInference, synth);

              auto err = deviceManager.initialiseWithDefaultDevices(1, 2);
              if (err.isNotEmpty()) {
                  statusLabel.setText("Audio Error: " + err, juce::dontSendNotification);
                  arranger.reset();
                  return;
              }
              deviceManager.addAudioCallback(this);
              statusLabel.setText("Audio: running", juce::dontSendNotification);
              startButton.setButtonText("Stop");
              arranger->start();
          }

          void MainComponent::stopAudio() {
              if (arranger) {
                  arranger->stop();
                  arranger.reset();
              }
              deviceManager.removeAudioCallback(this);
              deviceManager.closeAudioDevice();
              statusLabel.setText("Audio: stopped", juce::dontSendNotification);
              startButton.setButtonText("Start");
          }

          void MainComponent::paint(juce::Graphics& g) { g.fillAll(juce::Colour::fromRGB(20, 20, 30)); }

          void MainComponent::resized() {
              auto area = getLocalBounds().reduced(20);
              int blockHeight = area.getHeight() / 5;

              noteLabel.setBounds(area.removeFromTop(blockHeight));
              chordLabel.setBounds(area.removeFromTop(blockHeight));
              statusLabel.setBounds(area.removeFromTop(blockHeight));
              instrumentSelector.setBounds(area.removeFromTop(blockHeight).withSizeKeepingCentre(300, 40));
              startButton.setBounds(area.removeFromTop(blockHeight).withSizeKeepingCentre(200, 60));
          }

          void MainComponent::audioDeviceAboutToStart(juce::AudioIODevice* device) {
              pitchDetector = std::make_unique<PitchDetector>(device->getCurrentSampleRate());
              synth.initialize(device->getCurrentSampleRate());
          }

          void MainComponent::audioDeviceStopped() { pitchDetector.reset(); }

          void MainComponent::audioDeviceIOCallbackWithContext(const float* const* inputChannelData, int numInputChannels, float* const* outputChannelData, int numOutputChannels, int numSamples, const juce::AudioIODeviceCallbackContext&) {
              if (numInputChannels > 0 && inputChannelData[0] && pitchDetector) {
                  float freq = pitchDetector->detect(inputChannelData[0], numSamples);
                  if (freq > 0.0f) {
                      currentFreq.store(freq);
                      chordInference.addNote(PitchDetector::freqToMidi(freq));
                  }
              }
              if (numOutputChannels >= 2) {
                  synth.render(outputChannelData[0], outputChannelData[1], numSamples);
              }
          }

          void MainComponent::timerCallback() {
              float f = currentFreq.load();
              if (f > 0.0f) noteLabel.setText("Note: " + PitchDetector::freqToNote(f) + "\n(" + juce::String(f, 1) + " Hz)", juce::dontSendNotification);
              chordLabel.setText("Chord: " + chordInference.getChord(), juce::dontSendNotification);
          }
          EOF

          cat > Source/Main.cpp << 'EOF'
          #include <JuceHeader.h>
          #include "MainComponent.h"
          class AILiveBandApplication : public juce::JUCEApplication {
          public:
              const juce::String getApplicationName() override    { return "AI Live Band"; }
              const juce::String getApplicationVersion() override { return "0.1.0"; }
              bool moreThanOneInstanceAllowed() override          { return true; }
              void initialise(const juce::String&) override { mainWindow.reset(new MainWindow(getApplicationName())); }
              void shutdown() override { mainWindow.reset(); }
              void systemRequestedQuit() override { quit(); }
              class MainWindow : public juce::DocumentWindow {
              public:
                  explicit MainWindow(juce::String name) : DocumentWindow(name, juce::Colours::black, DocumentWindow::allButtons) {
                      setUsingNativeTitleBar(true); setContentOwned(new MainComponent(), true);
                      setResizable(true, true); centreWithSize(getWidth(), getHeight()); setVisible(true);
                  }
                  void closeButtonPressed() override { JUCEApplication::getInstance()->systemRequestedQuit(); }
              };
          private:
              std::unique_ptr<MainWindow> mainWindow;
          };
          START_JUCE_APPLICATION(AILiveBandApplication)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            CMakeLists.txt
            AILiveBand.jucer
            Source/

  # ─────────────────────────────────────────────
  # 2. LINUX
  # ─────────────────────────────────────────────
  build-linux:
    needs: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libegl-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Upload Linux app
        uses: actions/upload-artifact@v4
        with: { name: AILiveBand-linux, path: build/AILiveBand_artefacts/Release/AI Live Band }

  # ─────────────────────────────────────────────
  # 3. WINDOWS
  # ─────────────────────────────────────────────
  build-windows:
    needs: scaffold
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with: { name: AILiveBand-windows, path: build/AILiveBand_artefacts/Release/AI Live Band.exe }

  # ─────────────────────────────────────────────
  # 4. macOS
  # ─────────────────────────────────────────────
  build-macos:
    needs: scaffold
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with: { name: AILiveBand-macos, path: build/AILiveBand_artefacts/Release/AI Live Band.app }

  # ─────────────────────────────────────────────
  # 5. ANDROID
  # ─────────────────────────────────────────────
  build-android:
    needs: scaffold
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libglu1-mesa-dev mesa-common-dev libegl-dev
      - uses: android-actions/setup-android@v4
        with: { packages: '' }
      - name: Accept Android Licenses & Install NDK 26.3
        run: |
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME
      - name: Download Projucer
        run: |
          wget -q https://github.com/juce-framework/JUCE/releases/download/8.0.6/juce-8.0.6-linux.zip -O juce.zip
          unzip -q juce.zip
          cd JUCE/extras/Projucer/Builds/LinuxMakefile
          make -j$(nproc) CONFIG=Release
          cd ../../../../..
          echo "PROJUCER_PATH=$(pwd)/JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer" >> $GITHUB_ENV
      - name: Configure Projucer Global Paths
        run: ${{ env.PROJUCER_PATH }} --set-global-search-path linux defaultJuceModulePath $(pwd)/JUCE/modules
      - name: Resolve Projucer dependencies
        run: ${{ env.PROJUCER_PATH }} --resave AILiveBand.jucer
      
      - name: Inject Microphone Permission into Manifest
        run: |
          MANIFEST="Builds/Android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <application/' "$MANIFEST"

      - name: Fix Android SDK Location
        run: echo "sdk.dir=$ANDROID_HOME" > Builds/Android/local.properties

      - name: Inject Memory Limits into gradle.properties
        run: |
          cat > Builds/Android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.0.2 }
      - name: Generate Debug Keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        env: { ANDROID_NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/26.3.11579264" }
        run: |
          cd Builds/Android
          ./gradlew clean assembleDebug --stacktrace
      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with: { name: AILiveBand-android, path: "${{ env.APK_PATH }}" }
