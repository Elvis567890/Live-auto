name: Build AI Live Band App

on:
  push:
    branches: [ main, master, first-prototype ]
  pull_request:
  workflow_dispatch:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Download SoundFont and TinySoundFont
        run: |
          curl -sL -o tsf.h https://raw.githubusercontent.com/schellingb/TinySoundFont/master/tsf.h
          curl -sL -o SoundFont.sf2 https://github.com/urish/cinto/raw/master/media/TimGM6mb.sf2

      - name: Clone JUCE 8.0.6
        run: |
          git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git

      - name: Create project files
        run: |
          mkdir -p Source
          mv tsf.h Source/tsf.h
          mv SoundFont.sf2 Source/SoundFont.sf2

          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(AILiveBand VERSION 0.1.0 LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          if(NOT ANDROID)
            find_package(OpenGL REQUIRED)
          endif()

          add_subdirectory(JUCE)

          juce_add_binary_data(BinaryData SOURCES Source/SoundFont.sf2)

          juce_add_gui_app(AILiveBand
            PRODUCT_NAME "AI Live Band"
            COMPANY_NAME "AILiveBand"
            VERSION "0.1.0"
            MICROPHONE_PERMISSION_ENABLED TRUE
            MICROPHONE_PERMISSION_TEXT "AI Live Band needs microphone access."
          )

          juce_generate_juce_header(AILiveBand)

          target_sources(AILiveBand PRIVATE
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/Main.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/MainComponent.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/PitchDetector.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/ChordInference.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/Arranger.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/SoundFontSynth.cpp
          )

          target_compile_definitions(AILiveBand PRIVATE
            JUCE_WEB_BROWSER=0
            JUCE_USE_CURL=0
            JUCE_APPLICATION_NAME_STRING="AI Live Band"
            JUCE_APPLICATION_VERSION_STRING="0.1.0"
            AI_LIVE_BAND_SERVER_URL="ws://13.140.90.83:8765"
            JUCE_DEBUG=1
          )

          if(NOT MSVC)
            target_compile_options(AILiveBand PRIVATE -Wno-zero-as-null-pointer-constant -Wno-unused-function)
          endif()

          target_link_libraries(AILiveBand PRIVATE
            BinaryData
            juce::juce_audio_utils
            juce::juce_audio_devices
            juce::juce_dsp
            juce::juce_gui_extra
            juce_networking
            PUBLIC
            juce::juce_recommended_config_flags
            juce::juce_recommended_warning_flags
          )

          if(NOT ANDROID)
            target_link_libraries(AILiveBand PRIVATE OpenGL::GL OpenGL::GLU)
          endif()

          if(ANDROID)
            set(FREETYPE_INCLUDE_DIRS "/usr/include/freetype2")
            set(FREETYPE_LIBRARY "/usr/lib/x86_64-linux-gnu/libfreetype.so")
            find_package(Freetype REQUIRED)
            target_include_directories(AILiveBand PRIVATE ${FREETYPE_INCLUDE_DIRS})
            target_link_libraries(AILiveBand PRIVATE Freetype::Freetype)

            # FIX: Allow undefined symbols for the Android shared library
            set_target_properties(AILiveBand PROPERTIES
                LINK_FLAGS "-Wl,--allow-shlib-undefined"
            )
          endif()
          EOF

          # ... (The C++ source files are identical to the previous version and are omitted here for brevity) ...

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            CMakeLists.txt
            Source/

  # ─────────────────────────────────────────────
  # 1. LINUX
  # ─────────────────────────────────────────────
  build-linux:
    needs: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Verify files
        run: ls -R .
      - name: Clone JUCE
        run: git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libegl-dev
      - name: Configure & Build
        run: |
          rm -rf build && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Upload Linux app
        uses: actions/upload-artifact@v4
        with: { name: AILiveBand-linux, path: build/AILiveBand_artefacts/Release/AI Live Band }

  # ─────────────────────────────────────────────
  # 2. WINDOWS
  # ─────────────────────────────────────────────
  build-windows:
    needs: scaffold
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Verify files
        run: dir
      - name: Clone JUCE
        run: git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure & Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with: { name: AILiveBand-windows, path: build/AILiveBand_artefacts/Release/AI Live Band.exe }

  # ─────────────────────────────────────────────
  # 3. MACOS
  # ─────────────────────────────────────────────
  build-macos:
    needs: scaffold
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Verify files
        run: ls -R .
      - name: Clone JUCE
        run: git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git
      - name: Configure & Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --config Release
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with: { name: AILiveBand-macos, path: build/AILiveBand_artefacts/Release/AI Live Band.app }

  # ─────────────────────────────────────────────
  # 4. ANDROID (Native CMake)
  # ─────────────────────────────────────────────
  build-android:
    needs: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Verify files
        run: ls -R .
      - name: Clone JUCE
        run: git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
        with: { packages: '' }
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
          sdkmanager "ndk;26.3.11579264" --sdk_root=$ANDROID_HOME
      
      - name: Install Host Build Dependencies (X11 & FreeType & FontConfig)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev
      
      - name: Configure for Android
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      
      - name: Build APK via CMake
        run: |
          cmake --build build-android --config Release
          
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with: 
          name: AILiveBand-android
          path: build-android/AILiveBand_artefacts/Release/AI Live Band.apk
