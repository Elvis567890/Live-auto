build-android:
  needs: scaffold
  runs-on: ubuntu-latest
  continue-on-error: true
  steps:
    - uses: actions/download-artifact@v4
      with: { name: source }

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Install Android SDK components
      run: |
        yes | sdkmanager --licenses
        sdkmanager --install \
          "ndk;26.2.11394342" \
          "platforms;android-34" \
          "build-tools;34.0.0" \
          "cmake;3.22.1"

    - name: Set NDK Environment Variables
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

    - name: Install Linux deps for Projucer
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
          libxinerama-dev libxrandr-dev libxrender-dev \
          libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev \
          libgtk-3-dev libwebkit2gtk-4.1-dev

    - name: Download JUCE
      run: |
        git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

    - name: Build Projucer
      run: |
        cd JUCE/extras/Projucer/Builds/LinuxMakefile
        make CXXFLAGS="-Wno-error" -j$(nproc)

    - name: Create Projucer Project
      run: |
        cat > AILiveBand.jucer << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <JUCERPROJECT id="AILiveBand" name="AI Live Band" projectType="guiapp"
                      version="0.1.0" companyName="AILiveBand"
                      platform="android" buildVST="0" buildAU="0" buildVST3="0"
                      buildStandalone="1" buildiOS="0" buildAndroid="1"
                      androidMinimumSDK="24" androidTargetSDK="34">
          <MAINGROUP id="AILiveBand" name="AI Live Band">
            <GROUP id="Source" name="Source">
              <FILE id="Main_cpp" name="Main.cpp" compile="1" resource="0"
                    file="Source/Main.cpp"/>
              <FILE id="MainComponent_cpp" name="MainComponent.cpp" compile="1"
                    resource="0" file="Source/MainComponent.cpp"/>
              <FILE id="PitchDetector_cpp" name="PitchDetector.cpp" compile="1"
                    resource="0" file="Source/PitchDetector.cpp"/>
              <FILE id="ChordInference_cpp" name="ChordInference.cpp" compile="1"
                    resource="0" file="Source/ChordInference.cpp"/>
            </GROUP>
          </MAINGROUP>
          <EXPORTFORMATS>
            <ANDROIDSTUDIO targetFolder="Builds/Android" ndkVersion="26.2.11394342">
              <CONFIGURATIONS>
                <CONFIGURATION name="Debug" isDebug="1" optimisation="1"
                               targetName="AI Live Band"/>
                <CONFIGURATION name="Release" isDebug="0" optimisation="3"
                               targetName="AI Live Band"/>
              </CONFIGURATIONS>
            </ANDROIDSTUDIO>
          </EXPORTFORMATS>
        </JUCERPROJECT>
        EOF

    - name: Generate Android Studio Project
      run: |
        chmod +x JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer
        JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer \
          --resave AILiveBand.jucer

    - name: Configure Gradle Project
      working-directory: Builds/Android
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk/26.2.11394342" >> local.properties
        sed -i 's/com.android.tools.build:gradle:[0-9]\+\.[0-9]\+\.[0-9]\+/com.android.tools.build:gradle:8.5.1/g' build.gradle
        sed -i 's/com.android.tools.build:gradle:[0-9]\+\.[0-9]\+\.[0-9]\+/com.android.tools.build:gradle:8.5.1/g' app/build.gradle
        
        # FIX 1: Force Gradle to use JDK 17
        echo "org.gradle.java.home=$JAVA_HOME_17_X64" >> gradle.properties
        
        # FIX 2: Remove deprecated ARM mode flag
        sed -i 's/-DANDROID_ARM_MODE=arm//g' app/build.gradle
        
        # FIX 3: Add ProGuard rules to keep JUCE JNI classes
        cat > app/proguard-rules.pro << 'EOF'
        -keep class com.rmsl.juce.** { *; }
        -keepclassmembers class com.rmsl.juce.** { *; }
        -keepclasseswithmembernames class * { native <methods>; }
        EOF

    - name: Clean Build
      working-directory: Builds/Android
      run: |
        ./gradlew clean
        rm -rf .gradle

    - name: Build APK with Gradle
      working-directory: Builds/Android
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.2.11394342
        ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.2.11394342
      run: |
        chmod +x gradlew
        ./gradlew app:assembleRelease --stacktrace --info

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: AILiveBand-android
        path: Builds/Android/app/build/outputs/apk/release/*.apk
