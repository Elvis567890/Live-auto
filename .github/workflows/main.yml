name: Build AI Live Band App

on:
  push:
    branches: [ main, master, first-prototype ]
  pull_request:
  workflow_dispatch:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Download SoundFont and TinySoundFont
        run: |
          curl -sL -o tsf.h https://raw.githubusercontent.com/schellingb/TinySoundFont/master/tsf.h
          curl -sL -o SoundFont.sf2 https://github.com/urish/cinto/raw/master/media/TimGM6mb.sf2

      - name: Clone JUCE 8.0.6
        run: |
          git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git

      - name: Create project files
        run: |
          mkdir -p Source
          mv tsf.h Source/tsf.h
          mv SoundFont.sf2 Source/SoundFont.sf2

          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(AILiveBand VERSION 0.1.0 LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          # Find desktop OpenGL only for non-Android platforms
          if(NOT ANDROID)
            find_package(OpenGL REQUIRED)
          endif()

          add_subdirectory(JUCE)

          juce_add_binary_data(BinaryData SOURCES Source/SoundFont.sf2)

          juce_add_gui_app(AILiveBand
            PRODUCT_NAME "AI Live Band"
            COMPANY_NAME "AILiveBand"
            VERSION "0.1.0"
            MICROPHONE_PERMISSION_ENABLED TRUE
            MICROPHONE_PERMISSION_TEXT "AI Live Band needs microphone access."
          )

          juce_generate_juce_header(AILiveBand)

          target_sources(AILiveBand PRIVATE
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/Main.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/MainComponent.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/PitchDetector.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/ChordInference.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/Arranger.cpp
            ${CMAKE_CURRENT_SOURCE_DIR}/Source/SoundFontSynth.cpp
          )

          target_compile_definitions(AILiveBand PRIVATE
            JUCE_WEB_BROWSER=0
            JUCE_USE_CURL=0
            JUCE_APPLICATION_NAME_STRING="AI Live Band"
            JUCE_APPLICATION_VERSION_STRING="0.1.0"
            AI_LIVE_BAND_SERVER_URL="ws://13.140.90.83:8765"
            JUCE_DEBUG=1
          )

          if(NOT MSVC)
            target_compile_options(AILiveBand PRIVATE -Wno-zero-as-null-pointer-constant -Wno-unused-function)
          endif()

          target_link_libraries(AILiveBand PRIVATE
            BinaryData
            juce::juce_audio_utils
            juce::juce_audio_devices
            juce::juce_dsp
            juce::juce_gui_extra
            PUBLIC
            juce::juce_recommended_config_flags
            juce::juce_recommended_warning_flags
          )

          # Link desktop OpenGL and networking for non-Android platforms
          if(NOT ANDROID)
            target_link_libraries(AILiveBand PRIVATE OpenGL::GL OpenGL::GLU juce::juce_events)
          endif()

          # Android specific fixes
          if(ANDROID)
            # Only add the host's FreeType headers for compilation.
            target_include_directories(AILiveBand PRIVATE "/usr/include/freetype2")
            
            set_target_properties(AILiveBand PROPERTIES
                LINK_FLAGS "-Wl,--allow-shlib-undefined"
            )
          endif()
          EOF

          # --- Complete C++ Source Files ---
          cat > Source/PitchDetector.h << 'EOF'
          #pragma once
          #include <JuceHeader.h>
          class PitchDetector {
          public:
              explicit PitchDetector(double sampleRate);
              float detect(const float* samples, int numSamples, float& outConfidence);
              static juce::String freqToNote(float freq);
              static int freqToMidi(float freq);
          private:
              double sr;
          };
          EOF

          cat > Source/PitchDetector.cpp << 'EOF'
          #include "PitchDetector.h"
          PitchDetector::PitchDetector(double sampleRate) : sr(sampleRate) {}
          float PitchDetector::detect(const float* samples, int numSamples, float& outConfidence) {
              outConfidence = 0.0f;
              if (numSamples < 64) return 0.0f;
              float mean = 0.0f;
              for (int i = 0; i < numSamples; ++i) mean += samples[i];
              mean /= (float)numSamples;
              float energy = 0.0f;
              for (int i = 0; i < numSamples; ++i) { float v = samples[i] - mean; energy += v * v; }
              if (energy < 1e-5f) return 0.0f;
              int minLag = (int)(sr / 1000.0); int maxLag = (int)(sr / 60.0);
              if (maxLag >= numSamples) maxLag = numSamples - 1;
              if (minLag < 1) minLag = 1;
              int bestLag = 0; float bestCorr = 0.0f;
              for (int lag = minLag; lag <= maxLag; ++lag) {
                  float corr = 0.0f;
                  for (int i = 0; i < numSamples - lag; ++i) corr += (samples[i] - mean) * (samples[i + lag] - mean);
                  if (corr > bestCorr) { bestCorr = corr; bestLag = lag; }
              }
              float confidence = bestCorr / energy;
              outConfidence = confidence;
              if (bestLag == 0 || confidence < 0.2f) return 0.0f;
              return (float)(sr / (double)bestLag);
          }
          juce::String PitchDetector::freqToNote(float freq) {
              if (freq <= 0.0f) return "-";
              static const char* names[] = {"C","C#","D","D#","E","F","F#","G","G#","A","A#","B"};
              int midi = freqToMidi(freq); int pc = ((midi % 12) + 12) % 12; int oct = midi / 12 - 1;
              return juce::String(names[pc]) + juce::String(oct);
          }
          int PitchDetector::freqToMidi(float freq) {
              if (freq <= 0.0f) return 0;
              return (int)std::round(69.0 + 12.0 * std::log2(freq / 440.0));
          }
          EOF

          cat > Source/ChordInference.h << 'EOF'
          #pragma once
          #include <JuceHeader.h>
          #include <vector>
          class ChordInference {
          public:
              void addNote(int midi);
              juce::String getChord() const;
              int getRootNote() const;
              std::vector<int> getChordNotes() const;
              void clear();
          private:
              std::vector<int> recent;
              mutable juce::CriticalSection lock;
          };
          EOF

          cat > Source/ChordInference.cpp << 'EOF'
          #include "ChordInference.h"
          namespace {
              const char* ROOTS[] = {"C","C#","D","D#","E","F","F#","G","G#","A","A#","B"};
              struct Template { const char* name; std::vector<int> intervals; };
              const std::vector<Template> TEMPLATES = {
                  {"maj",  {0,4,7}}, {"min",  {0,3,7}}, {"dim",  {0,3,6}}, {"aug",  {0,4,8}}, {"sus4", {0,5,7}}, {"maj7", {0,4,7,11}}, {"min7", {0,3,7,10}},
              };
          }
          void ChordInference::addNote(int midi) {
              if (midi <= 0) return;
              const juce::ScopedLock sl(lock);
              recent.push_back(midi);
              if (recent.size() > 12) recent.erase(recent.begin());
          }
          void ChordInference::clear() { const juce::ScopedLock sl(lock); recent.clear(); }
          juce::String ChordInference::getChord() const {
              const juce::ScopedLock sl(lock);
              if (recent.empty()) return "-";
              int counts[12] = {0};
              for (int n : recent) counts[((n % 12) + 12) % 12]++;
              int bestRoot = -1, bestScore = -1; juce::String bestName;
              for (int root = 0; root < 12; ++root) {
                  for (auto& t : TEMPLATES) {
                      int score = 0, outside = 0; bool inChord[12] = {false};
                      for (int iv : t.intervals) inChord[(root + iv) % 12] = true;
                      for (int pc = 0; pc < 12; ++pc) { if (inChord[pc]) score += counts[pc]; else outside += counts[pc]; }
                      score -= outside / 2;
                      if (score > bestScore) { bestScore = score; bestRoot = root; bestName = juce::String(ROOTS[root]) + t.name; }
                  }
              }
              return bestRoot < 0 ? juce::String("-") : bestName;
          }
          int ChordInference::getRootNote() const {
              juce::String chord = getChord(); if (chord == "-") return 48;
              for (int i = 0; i < 12; ++i) { if (chord.startsWith(ROOTS[i])) return 48 + i; }
              return 48;
          }
          std::vector<int> ChordInference::getChordNotes() const {
              std::vector<int> notes; juce::String chord = getChord(); if (chord == "-") return notes;
              int root = 60; juce::String quality = chord;
              for (int i = 0; i < 12; ++i) {
                  if (chord.startsWith(ROOTS[i])) { root += i; quality = chord.substring(juce::String(ROOTS[i]).length()); break; }
              }
              notes.push_back(root);
              if (quality.contains("maj")) { notes.push_back(root+4); notes.push_back(root+7); if (quality.contains("7")) notes.push_back(root+11); }
              else if (quality.contains("min")) { notes.push_back(root+3); notes.push_back(root+7); if (quality.contains("7")) notes.push_back(root+10); }
              else if (quality.contains("dim")) { notes.push_back(root+3); notes.push_back(root+6); }
              else if (quality.contains("aug")) { notes.push_back(root+4); notes.push_back(root+8); }
              else if (quality.contains("sus4")) { notes.push_back(root+5); notes.push_back(root+7); }
              return notes;
          }
          EOF

          cat > Source/SoundFontSynth.h << 'EOF'
          #pragma once
          #include <JuceHeader.h>
          struct tsf;
          class SoundFontSynth {
          public:
              SoundFontSynth();
              ~SoundFontSynth();
              void initialize(double sampleRate);
              void noteOn(int channel, int midiNote, float velocity);
              void noteOff(int channel, int midiNote);
              void render(float* leftChannel, float* rightChannel, int numSamples);
              void setInstrument(int channel, int programNumber);
          private:
              tsf* synth = nullptr;
          };
          EOF

          cat > Source/SoundFontSynth.cpp << 'EOF'
          #include "SoundFontSynth.h"
          #define TSF_IMPLEMENTATION
          #include "tsf.h"
          SoundFontSynth::SoundFontSynth() {}
          SoundFontSynth::~SoundFontSynth() { if (synth) { tsf_close(synth); synth = nullptr; } }
          void SoundFontSynth::initialize(double sampleRate) {
              if (synth) { tsf_close(synth); synth = nullptr; }
              if (BinaryData::SoundFont_sf2Size == 0) return;
              try {
                  synth = tsf_load_memory(BinaryData::SoundFont_sf2, BinaryData::SoundFont_sf2Size);
                  if (synth && sampleRate > 0) {
                      tsf_set_output(synth, TSF_STEREO_INTERLEAVED, (int)sampleRate, 0);
                      tsf_channel_set_presetnumber(synth, 0, 0, 0);
                      tsf_channel_set_presetnumber(synth, 1, 32, 0);
                      tsf_channel_set_presetnumber(synth, 2, 48, 0);
                      tsf_channel_set_presetnumber(synth, 3, 56, 0);
                      tsf_channel_set_presetnumber(synth, 4, 27, 0);
                      tsf_channel_set_presetnumber(synth, 9, 0, 1);
                  }
              } catch (...) { synth = nullptr; }
          }
          void SoundFontSynth::noteOn(int channel, int midiNote, float velocity) { if (synth) tsf_channel_note_on(synth, channel, midiNote, velocity); }
          void SoundFontSynth::noteOff(int channel, int midiNote) { if (synth) tsf_channel_note_off(synth, channel, midiNote); }
          void SoundFontSynth::render(float* leftChannel, float* rightChannel, int numSamples) {
              if (synth) {
                  juce::HeapBlock<float> interleavedBuffer(numSamples * 2);
                  tsf_render_float(synth, interleavedBuffer.getData(), numSamples, 0);
                  for (int i = 0; i < numSamples; ++i) {
                      leftChannel[i] = interleavedBuffer[i * 2];
                      if (rightChannel) rightChannel[i] = interleavedBuffer[i * 2 + 1];
                  }
              } else {
                  juce::FloatVectorOperations::clear(leftChannel, numSamples);
                  if (rightChannel) juce::FloatVectorOperations::clear(rightChannel, numSamples);
              }
          }
          void SoundFontSynth::setInstrument(int channel, int programNumber) { if (synth) tsf_channel_set_presetnumber(synth, channel, programNumber, 0); }
          EOF

          cat > Source/Arranger.h << 'EOF'
          #pragma once
          #include <JuceHeader.h>
          #include "ChordInference.h"
          #include "SoundFontSynth.h"
          class Arranger : public juce::Timer {
          public:
              Arranger(ChordInference& ci, SoundFontSynth& s);
              ~Arranger() override;
              void start();
              void stop();
              void sendToServer(int midiNote, float energy, float pitchSpeed, juce::String chord);
              bool isConnected() const { return connected.load(); }
          private:
              void timerCallback() override;
              void scheduleNote(int channel, int pitch, int velocity, int durationMs, double timeOffsetMs);
              void handleEvent(const juce::var& event);
              ChordInference& chordEngine;
              SoundFontSynth& synth;
              struct PendingNote { int channel, pitch; int64 triggerMs; };
              std::vector<PendingNote> pendingNotes;
              std::atomic<bool> connected { false };
              juce::String aiResponse;
              juce::CriticalSection responseLock;
              JUCE_DECLARE_NON_COPYABLE_WITH_LEAK_DETECTOR(Arranger)
          };
          EOF

          cat > Source/Arranger.cpp << 'EOF'
          #include "Arranger.h"
          #ifndef AI_LIVE_BAND_SERVER_URL
          #define AI_LIVE_BAND_SERVER_URL "ws://127.0.0.1:8765"
          #endif
          static const juce::String SERVER_URL = AI_LIVE_BAND_SERVER_URL;
          Arranger::Arranger(ChordInference& ci, SoundFontSynth& s) : chordEngine(ci), synth(s) {}
          Arranger::~Arranger() { stop(); }
          void Arranger::start() {
              connected.store(true);
              startTimerHz(30);
          }
          void Arranger::stop() { 
              stopTimer(); 
              connected.store(false); 
          }
          void Arranger::sendToServer(int midiNote, float energy, float pitchSpeed, juce::String chord) {
              juce::ignoreUnused(midiNote, energy, pitchSpeed, chord);
          }
          void Arranger::timerCallback() {
              juce::String msg;
              { const juce::ScopedLock sl(responseLock); msg = aiResponse; if (msg.isEmpty()) return; aiResponse.clear(); }
              juce::var parsed = juce::JSON::parse(msg);
              if (auto* root = parsed.getDynamicObject()) {
                  if (auto* events = root->getProperty("events").getArray()) {
                      for (auto& ev : *events) handleEvent(ev);
                  }
              }
              const int64 now = juce::Time::currentTimeMillis();
              for (auto it = pendingNotes.begin(); it != pendingNotes.end(); ) {
                  if (now >= it->triggerMs) { synth.noteOn(it->channel, it->pitch, 0.8f); it = pendingNotes.erase(it); }
                  else ++it;
              }
          }
          void Arranger::scheduleNote(int channel, int pitch, int velocity, int durationMs, double timeOffsetMs) {
              juce::ignoreUnused(velocity);
              pendingNotes.push_back({ channel, pitch, (int64)(juce::Time::currentTimeMillis() + (int64)timeOffsetMs) });
              juce::Timer::callAfterDelay(durationMs, [this, channel, pitch] { synth.noteOff(channel, pitch); });
          }
          void Arranger::handleEvent(const juce::var& event) {
              auto* obj = event.getDynamicObject();
              if (!obj) return;
              juce::String type = obj->getProperty("type").toString();
              double timeOffset = (double)obj->getProperty("time");
              if (type == "note") {
                  scheduleNote((int)obj->getProperty("channel"), (int)obj->getProperty("pitch"),
                               (int)obj->getProperty("velocity"), (int)obj->getProperty("duration"), timeOffset);
              } else if (type == "program") {
                  synth.setInstrument((int)obj->getProperty("channel"), (int)obj->getProperty("program"));
              }
          }
          EOF

          cat > Source/MainComponent.h << 'EOF'
          #pragma once
          #include <JuceHeader.h>
          #include "PitchDetector.h"
          #include "ChordInference.h"
          #include "Arranger.h"
          #include "SoundFontSynth.h"
          class MainComponent : public juce::Component, public juce::AudioIODeviceCallback, private juce::Timer {
          public:
              MainComponent();
              ~MainComponent() override;
              void paint(juce::Graphics&) override;
              void resized() override;
              void audioDeviceIOCallbackWithContext(const float* const* inputChannelData, int numInputChannels, float* const* outputChannelData, int numOutputChannels, int numSamples, const juce::AudioIODeviceCallbackContext& context) override;
              void audioDeviceAboutToStart(juce::AudioIODevice* device) override;
              void audioDeviceStopped() override;
          private:
              void timerCallback() override;
              void startAudio();
              void stopAudio();
              void showAudioSettings();
              juce::AudioDeviceManager deviceManager;
              std::unique_ptr<PitchDetector> pitchDetector;
              ChordInference chordInference;
              SoundFontSynth synth;
              std::unique_ptr<Arranger> arranger;
              std::unique_ptr<juce::AudioDeviceSelectorComponent> deviceSelector;
              juce::Label noteLabel, chordLabel, stateLabel;
              juce::TextButton startButton { "Start" };
              juce::TextButton testButton { "Test AI" };
              juce::TextButton settingsButton { "Settings" };
              std::atomic<float> currentFreq { 0.0f };
              std::atomic<float> currentConfidence { 0.0f };
              std::atomic<float> currentEnergy { 0.0f };
              std::atomic<float> pitchSpeed { 0.0f };
              float lastPitch = 0.0f;
              JUCE_DECLARE_NON_COPYABLE_WITH_LEAK_DETECTOR(MainComponent)
          };
          EOF

          cat > Source/MainComponent.cpp << 'EOF'
          #include "MainComponent.h"
          MainComponent::MainComponent() {
              addAndMakeVisible(noteLabel); addAndMakeVisible(chordLabel); addAndMakeVisible(stateLabel);
              addAndMakeVisible(startButton); addAndMakeVisible(testButton); addAndMakeVisible(settingsButton);
              stateLabel.setFont(juce::Font(juce::FontOptions(28.0f, juce::Font::bold)));
              noteLabel.setFont(juce::Font(juce::FontOptions(48.0f, juce::Font::bold)));
              chordLabel.setFont(juce::Font(juce::FontOptions(36.0f)));
              noteLabel.setJustificationType(juce::Justification::centred);
              chordLabel.setJustificationType(juce::Justification::centred);
              stateLabel.setJustificationType(juce::Justification::centred);
              noteLabel.setColour(juce::Label::textColourId, juce::Colours::white);
              chordLabel.setColour(juce::Label::textColourId, juce::Colour::fromRGB(0, 255, 200));
              stateLabel.setColour(juce::Label::textColourId, juce::Colours::cyan);
              startButton.setColour(juce::TextButton::buttonColourId, juce::Colour::fromRGB(0, 100, 80));
              testButton.setColour(juce::TextButton::buttonColourId, juce::Colour::fromRGB(100, 80, 0));
              settingsButton.setColour(juce::TextButton::buttonColourId, juce::Colour::fromRGB(40, 40, 40));
              startButton.onClick = [this] {
                  if (!deviceManager.getCurrentAudioDevice()) {
                      if (!juce::RuntimePermissions::isGranted(juce::RuntimePermissions::recordAudio)) {
                          juce::RuntimePermissions::request(juce::RuntimePermissions::recordAudio, [this](bool granted) {
                              if (granted) startAudio(); else stateLabel.setText("MIC DENIED", juce::dontSendNotification);
                          });
                      } else startAudio();
                  } else { stopAudio(); stateLabel.setText("OFFLINE", juce::dontSendNotification); startButton.setButtonText("Start"); }
              };
              testButton.onClick = [this] {
                  if (!arranger || !arranger->isConnected()) return;
                  juce::Timer::callAfterDelay(0, [this] { arranger->sendToServer(60, 0.8f, 0.1f, "Cmaj"); });
                  juce::Timer::callAfterDelay(200, [this] { arranger->sendToServer(64, 0.8f, 0.1f, "Cmaj"); });
                  juce::Timer::callAfterDelay(400, [this] { arranger->sendToServer(67, 0.8f, 0.1f, "Cmaj"); });
                  juce::Timer::callAfterDelay(600, [this] { arranger->sendToServer(60, 0.8f, 0.1f, "Cmaj"); });
                  juce::Timer::callAfterDelay(800, [this] { arranger->sendToServer(64, 0.8f, 0.1f, "Cmaj"); });
                  juce::Timer::callAfterDelay(1000, [this] { arranger->sendToServer(67, 0.8f, 0.1f, "Cmaj"); });
                  juce::Timer::callAfterDelay(1200, [this] { arranger->sendToServer(60, 0.8f, 0.1f, "Cmaj"); });
                  juce::Timer::callAfterDelay(1400, [this] { arranger->sendToServer(64, 0.8f, 0.1f, "Cmaj"); });
              };
              settingsButton.onClick = [this] { showAudioSettings(); };
              setSize(700, 600);
              startTimerHz(60);
          }
          MainComponent::~MainComponent() { stopTimer(); stopAudio(); }
          void MainComponent::showAudioSettings() {
              if (!deviceSelector) {
                  deviceSelector = std::make_unique<juce::AudioDeviceSelectorComponent>(deviceManager, 1, 2, 2, 2, false, false, true, false);
                  deviceSelector->setSize(500, 400);
                  juce::DialogWindow::LaunchOptions options;
                  options.content.setNonOwned(deviceSelector.get());
                  options.dialogTitle = "Audio Routing (Mic & Speaker)";
                  options.dialogBackgroundColour = juce::Colours::darkgrey;
                  options.escapeKeyTriggersCloseButton = true;
                  options.useNativeTitleBar = true;
                  options.resizable = false;
                  options.launchAsync();
              }
          }
          void MainComponent::startAudio() {
              if (deviceManager.getCurrentAudioDevice()) return;
              arranger = std::make_unique<Arranger>(chordInference, synth);
              auto err = deviceManager.initialiseWithDefaultDevices(1, 2);
              if (err.isNotEmpty()) { stateLabel.setText("AUDIO ERROR", juce::dontSendNotification); arranger.reset(); return; }
              deviceManager.addAudioCallback(this);
              stateLabel.setText("WAITING FOR AI...", juce::dontSendNotification);
              startButton.setButtonText("Stop");
              if (arranger) arranger->start();
          }
          void MainComponent::stopAudio() {
              if (arranger) { arranger->stop(); arranger.reset(); }
              if (deviceManager.getCurrentAudioDevice()) { deviceManager.removeAudioCallback(this); deviceManager.closeAudioDevice(); }
          }
          void MainComponent::paint(juce::Graphics& g) {
              g.fillAll(juce::Colour::fromRGB(10, 12, 18));
              auto center = getLocalBounds().getCentre();
              float radius = 100.0f + (currentEnergy.load() * 200.0f);
              juce::ColourGradient grad(juce::Colour::fromRGB(0, 255, 200).withAlpha(0.2f), (float)center.x, (float)center.y,
                                        juce::Colour::fromRGB(0, 0, 0).withAlpha(0.0f), (float)center.x + radius, (float)center.y, true);
              g.setGradientFill(grad);
              g.fillEllipse((float)center.x - radius, (float)center.y - radius, radius * 2, radius * 2);
          }
          void MainComponent::resized() {
              auto area = getLocalBounds().reduced(40);
              stateLabel.setBounds(area.removeFromTop(60));
              area.removeFromTop(40);
              noteLabel.setBounds(area.removeFromTop(100));
              chordLabel.setBounds(area.removeFromTop(60));
              area.removeFromBottom(80);
              auto buttonArea = area.removeFromBottom(60);
              startButton.setBounds(buttonArea.removeFromLeft(buttonArea.getWidth() / 3).reduced(10));
              testButton.setBounds(buttonArea.removeFromLeft(buttonArea.getWidth() / 2).reduced(10));
              settingsButton.setBounds(buttonArea.reduced(10));
          }
          void MainComponent::audioDeviceAboutToStart(juce::AudioIODevice* device) {
              pitchDetector = std::make_unique<PitchDetector>(device->getCurrentSampleRate());
              synth.initialize(device->getCurrentSampleRate());
          }
          void MainComponent::audioDeviceStopped() { pitchDetector.reset(); }
          void MainComponent::audioDeviceIOCallbackWithContext(const float* const* inputChannelData, int numInputChannels, float* const* outputChannelData, int numOutputChannels, int numSamples, const juce::AudioIODeviceCallbackContext&) {
              if (numInputChannels > 0 && inputChannelData[0] && pitchDetector) {
                  float rms = 0.0f;
                  for (int i = 0; i < numSamples; ++i) rms += inputChannelData[0][i] * inputChannelData[0][i];
                  rms = std::sqrt(rms / numSamples);
                  float confidence = 0.0f;
                  float freq = pitchDetector->detect(inputChannelData[0], numSamples, confidence);
                  currentConfidence.store(confidence);
                  currentEnergy.store(rms);
                  if (freq > 0.0f && confidence > 0.4f) {
                      currentFreq.store(freq);
                      pitchSpeed.store(std::abs(freq - lastPitch) / 100.0f);
                      lastPitch = freq;
                      chordInference.addNote(PitchDetector::freqToMidi(freq));
                  }
                  if (arranger) arranger->sendToServer(PitchDetector::freqToMidi(freq), rms, pitchSpeed.load(), chordInference.getChord());
              }
              if (numOutputChannels >= 2) synth.render(outputChannelData[0], outputChannelData[1], numSamples);
          }
          void MainComponent::timerCallback() {
              float f = currentFreq.load(); float conf = currentConfidence.load(); float energy = currentEnergy.load();
              if (f > 0.0f && conf > 0.4f) {
                  noteLabel.setText(PitchDetector::freqToNote(f), juce::dontSendNotification);
                  chordLabel.setText(chordInference.getChord(), juce::dontSendNotification);
                  stateLabel.setText("SINGING", juce::dontSendNotification);
                  stateLabel.setColour(juce::Label::textColourId, juce::Colours::cyan);
              } else if (energy > 0.02f) {
                  noteLabel.setText("-", juce::dontSendNotification);
                  chordLabel.setText("-", juce::dontSendNotification);
                  stateLabel.setText("TALKING (MUTED)", juce::dontSendNotification);
                  stateLabel.setColour(juce::Label::textColourId, juce::Colours::yellow);
              } else {
                  noteLabel.setText("-", juce::dontSendNotification);
                  chordLabel.setText("-", juce::dontSendNotification);
                  if (arranger && arranger->isConnected()) { stateLabel.setText("LISTENING...", juce::dontSendNotification); stateLabel.setColour(juce::Label::textColourId, juce::Colours::green); }
                  else { stateLabel.setText("WAITING FOR SERVER", juce::dontSendNotification); stateLabel.setColour(juce::Label::textColourId, juce::Colours::red); }
              }
              repaint();
          }
          EOF

          cat > Source/Main.cpp << 'EOF'
          #include <JuceHeader.h>
          #include "MainComponent.h"
          class AILiveBandApplication : public juce::JUCEApplication {
          public:
              const juce::String getApplicationName() override    { return "AI Live Band"; }
              const juce::String getApplicationVersion() override { return "0.1.0"; }
              bool moreThanOneInstanceAllowed() override          { return true; }
              void initialise(const juce::String&) override { mainWindow.reset(new MainWindow(getApplicationName())); }
              void shutdown() override { mainWindow.reset(); }
              void systemRequestedQuit() override { quit(); }
              class MainWindow : public juce::DocumentWindow {
              public:
                  explicit MainWindow(juce::String name) : DocumentWindow(name, juce::Colours::black,
                      #if JUCE_ANDROID
                      0
                      #else
                      DocumentWindow::allButtons
                      #endif
                  ) {
                      #if !JUCE_ANDROID
                      setUsingNativeTitleBar(true);
                      setResizable(true, true);
                      #endif
                      setContentOwned(new MainComponent(), true);
                      centreWithSize(getWidth(), getHeight());
                      setVisible(true);
                  }
                  void closeButtonPressed() override { JUCEApplication::getInstance()->systemRequestedQuit(); }
              };
          private:
              std::unique_ptr<MainWindow> mainWindow;
          };
          START_JUCE_APPLICATION(AILiveBandApplication)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            CMakeLists.txt
            Source/

  # ─────────────────────────────────────────────
  # 1. LINUX
  # ─────────────────────────────────────────────
  build-linux:
    needs: scaffold
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Verify files
        run: ls -R .
      - name: Clone JUCE
        run: git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libegl-dev
      - name: Configure & Build
        run: |
          rm -rf build && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Upload Linux app
        if: success()
        uses: actions/upload-artifact@v4
        with: { name: AILiveBand-linux, path: build/AILiveBand_artefacts/Release/AI Live Band }

  # ─────────────────────────────────────────────
  # 2. WINDOWS
  # ─────────────────────────────────────────────
  build-windows:
    needs: scaffold
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Verify files
        run: dir
      - name: Clone JUCE
        run: git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure & Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Upload Windows app
        if: success()
        uses: actions/upload-artifact@v4
        with: { name: AILiveBand-windows, path: build/AILiveBand_artefacts/Release/AI Live Band.exe }

  # ─────────────────────────────────────────────
  # 3. MACOS
  # ─────────────────────────────────────────────
  build-macos:
    needs: scaffold
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Verify files
        run: ls -R .
      - name: Clone JUCE
        run: git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git
      - name: Configure & Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --config Release
      - name: Upload macOS app
        if: success()
        uses: actions/upload-artifact@v4
        with: { name: AILiveBand-macos, path: build/AILiveBand_artefacts/Release/AI Live Band.app }

  # ─────────────────────────────────────────────
  # 4. ANDROID (Native CMake)
  # ─────────────────────────────────────────────
  build-android:
    needs: scaffold
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Verify files
        run: ls -R .
      - name: Clone JUCE
        run: git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
        with: { packages: '' }
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
          sdkmanager "ndk;26.3.11579264" --sdk_root=$ANDROID_HOME

      - name: Install Host Build Dependencies (X11 & FreeType & FontConfig)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev

      - name: Configure for Android
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build APK via CMake
        run: |
          cmake --build build-android --config Release

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AILiveBand-android
          path: build-android/AILiveBand_artefacts/Release/AI Live Band.apk
